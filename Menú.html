<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8E8EC; --ink:#3B2329; --muted:#8A6A72; --accent:#B23A5E; --line:#E3C2CB;
  --wa:#1FA855; --wa-ink:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241418; --ink:#F6E7EB; --muted:#B99AA3; --accent:#F08CAA; --line:#4A3139;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241418; --ink:#F6E7EB; --muted:#B99AA3; --accent:#F08CAA; --line:#4A3139;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.5;
}
main{max-width:560px; margin:0 auto; padding:72px 28px 150px}
h1{
  font-family:"Instrument Serif",Georgia,"Times New Roman",serif;
  font-weight:400; font-size:clamp(64px,18vw,96px); line-height:.95;
  letter-spacing:-.02em; margin:0 0 12px;
}
.lead{color:var(--muted); margin:0 0 56px; max-width:32ch}
ul{list-style:none; margin:0; padding:0}
li{
  display:flex; align-items:baseline; gap:12px;
  padding:22px 0; border-top:1px solid var(--line);
}
li:last-child{border-bottom:1px solid var(--line)}
.name{
  font-family:"Instrument Serif",Georgia,"Times New Roman",serif;
  font-size:32px; line-height:1.1; white-space:nowrap;
}
.dots{flex:1; min-width:16px; border-bottom:1px dotted var(--line); transform:translateY(-5px)}
.price{font-weight:500; color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums}
.ask{color:var(--muted); text-align:right; font-size:15px; line-height:1.3; max-width:15ch}
li.ask-row .dots{display:none}
li.ask-row{justify-content:space-between}

.wa{
  position:fixed; right:20px; bottom:0;
  margin-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  display:inline-flex; align-items:center; gap:10px;
  background:var(--wa); color:var(--wa-ink); text-decoration:none;
  font-weight:500; font-size:16px;
  padding:14px 20px 14px 16px; border-radius:999px;
  box-shadow:0 6px 20px rgba(0,0,0,.22);
  transition:transform .15s ease;
}
.wa:hover{transform:translateY(-2px)}
.wa:active{transform:scale(.97)}
.wa:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.wa svg{width:24px; height:24px; flex:none}
@media (prefers-reduced-motion:reduce){.wa{transition:none}}
@media (max-width:380px){.name{font-size:28px}}
</style>
</head>
<body>
<main>
  <h1>Menú</h1>
  <p class="lead">Para hacer tu pedido, escribinos por WhatsApp.</p>
  <ul>
    <li><span class="name">Prepizza</span><span class="dots"></span><span class="price">2 × $3.000</span></li>
    <li><span class="name">Pastafrola</span><span class="dots"></span><span class="price">$18.000</span></li>
    <li><span class="name">Toffi</span><span class="dots"></span><span class="price">$22.000</span></li>
    <li class="ask-row"><span class="name">Cookies</span><span class="ask">Consultá sabores y precio</span></li>
  </ul>
</main>

<a class="wa" href="https://wa.me/5493364360860?text=Hola%2C%20quiero%20hacer%20un%20pedido" target="_blank" rel="noopener" aria-label="Pedir por WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2Zm0 18.15c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.25-8.23s8.23 3.69 8.23 8.23-3.69 8.24-8.23 8.24Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.16.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28Z"/></svg>
  <span>Pedir por WhatsApp</span>
</a>
</body>
</html>
